version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: continuum_postgres
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: continuum_dev_password
    ports:
      - "5432:5432"
    volumes:
      - continuum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum -d continuum"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: continuum_backend
    environment:
      DATABASE_URL: postgresql+psycopg://continuum:continuum_dev_password@postgres:5432/continuum
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: continuum_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  continuum_pgdata:
